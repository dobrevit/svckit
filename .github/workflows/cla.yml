name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  cla:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read       # signatures live in a separate repository
      pull-requests: write
      statuses: write
    steps:
      - name: Check the CLA
        if: (github.event.comment.body == 'I have read the CLA document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained PAT with contents:write on the signatures
          # repository. Kept out of this repo so a contributor cannot alter
          # the signature record through a pull request.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/dobrevit/svckit/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot],dobrevit
          remote-organization-name: dobrevit
          remote-repository-name: cla-signatures
          custom-notsigned-prcomment: |
            Thanks for the pull request. Before it can be merged, please read
            our [CLA](https://github.com/dobrevit/svckit/blob/main/CLA.md) and
            sign it by posting a comment on this PR containing exactly:
          custom-pr-sign-comment: "I have read the CLA document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thanks!"
