name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Breaking changes"
    labels:
      - breaking
  - title: "Features"
    labels:
      - feature
      - enhancement
  - title: "Fixes"
    labels:
      - bug
      - fix
  - title: "Security"
    labels:
      - security
  - title: "Performance"
    labels:
      - performance
  - title: "Documentation"
    labels:
      - documentation
  - title: "Testing and CI"
    labels:
      - test
      - ci
  - title: "Dependencies"
    collapse-after: 5
    labels:
      - dependencies

exclude-labels:
  - skip-changelog

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

# While the project is 0.x a breaking change bumps the minor, not the major:
# the API is explicitly not frozen until v1.0.0.
version-resolver:
  minor:
    labels:
      - breaking
      - feature
      - enhancement
  patch:
    labels:
      - bug
      - fix
      - security
      - documentation
      - dependencies
      - test
      - ci
  default: patch

template: |
  ## What changed

  $CHANGES

  **Full changelog:** https://github.com/dobrevit/svckit/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ---

  svckit is pre-1.0: the API may still move between minor releases. See
  [CHANGELOG.md](https://github.com/dobrevit/svckit/blob/main/CHANGELOG.md).
