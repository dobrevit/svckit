# The TLS listener of rabbitmq-tls-test. The certificates are written to
# .compose-tls/ by internal/testtls when a test starts the service; they are
# throwaway, made fresh each time.
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.pem
ssl_options.certfile = /certs/server.pem
ssl_options.keyfile = /certs/server-key.pem
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true

# EXTERNAL takes the user from the client certificate's common name.
auth_mechanisms.1 = EXTERNAL
auth_mechanisms.2 = PLAIN
auth_mechanisms.3 = AMQPLAIN
ssl_cert_login_from = common_name
